[project]
name = "klangk"
dynamic = ["version"]
description = "Klangk: multi-user Pi coding agent — server (klangkd) and client (klangk)"
requires-python = ">=3.12"
# One unified wheel ships a single top-level package (klangk) with the CLI
# folded in as klangk.cli.  One ``pip install klangk`` yields both the
# ``klangkd`` server and ``klangk`` client binaries (#1606).
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.30",
    "starlette>=1.3.1",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1",
    "logfire[fastapi]>=3.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "textual>=0.86.0",
    "litellm>=1.60.0",
]

# Test toolchain — opt in via `pip install klangk[test]` or
# `uv sync --extra test`. Kept out of the runtime ``dependencies`` so a
# production ``pip install klangk`` doesn't pull pytest + its transitive
# deps (pluggy, iniconfig, packaging, coverage, execnet, ~a dozen pkgs)
# that have no role at runtime (#1673).
[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.3.0",
    # Selects only tests whose coverage touches changed source lines, for
    # fast local iteration. Optional in spirit: CI runs the full suite the
    # documented way (`-n auto`, full coverage); this powers the local
    # `--testmon` scoped loop (#2288).
    "pytest-testmon>=2.0.0",
]

[project.scripts]
# User-facing command names are unchanged — they're entrypoint names,
# distinct from the package names. One ``pip install klangk`` yields both.
klangkd = "klangk.main:app"
klangk = "klangk.cli.main:main"
klangk-build-nix-seed = "klangk.seed:main"
klangk-load-nix-seed-btrfs = "klangk.seed:load_main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--capture=no --cov=klangk --cov-branch --cov-report=term-missing --no-cov-on-fail --cov-fail-under=100 --timeout=60"
# Treat new warnings as errors so they can't re-accumulate (#1493). The
# two ignores are pre-existing mock-induced GC artifacts (MagicMock stubs
# whose coroutine objects are collected in a later test) -- not real bugs
# -- and are mirrored in the repo-root pyproject for the combined run.
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 79

# Coverage config for runs whose CWD is src/klangk itself (e.g. `cd
# src/klangk && pytest ...`). coverage discovers [tool.coverage.run]
# relative to the CWD, not the pytest rootdir, so the repo-root
# pyproject's copy of this section is what the documented from-root
# invocations read; this local copy keeps CWD-here runs identical.
# Keep in sync with the root pyproject.toml (#2834). See there for why
# branch coverage needs the C tracer + greenlet concurrency on 3.13.
[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options.root = "../.."
raw-options.tag_regex = "^v(?P<version>[vV]?\\d+(?:\\.\\d+){0,2}[^\\+]*)(?:\\+.*)?$"
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

# Ship the compiled Flutter web build inside the wheel at klangk/frontend so
# a `pip install klangk` deployment serves the UI out of the box (#1600).
# Implemented by a build hook (hatch_build_frontend.py) rather than a static
# `force-include`: a static force-include is strict for every build mode and
# would break editable installs (devenv, CI) where the gitignored frontend
# artifact is absent. The hook includes it when present and *requires* it
# only for a non-editable wheel build (the release guard).
[tool.hatch.build.hooks.custom]
path = "hatch_build_package_data.py"

[tool.hatch.build.targets.wheel]
packages = ["klangk"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
