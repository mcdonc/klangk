# Klangk container tmux defaults — tmux is invisible infrastructure.
# Users never interact with tmux directly; the web UI and CLI client
# manage windows/panes via control mode.

# Strip all default keybindings — no prefix key
unbind-key -a

# Terminal settings (login shell comes from /etc/passwd, not tmux)
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 0
set -g history-limit 50000
set -g allow-passthrough on

# Pass through extended keys to applications (csi-u format for Pi compatibility)
set -g extended-keys on
set -g extended-keys-format csi-u
set -gs terminal-features 'xterm*:extkeys'

# Mouse on — enables wheel scrollback and cross-viewport text selection.
# Tradeoff: native terminal selection requires Shift+drag (standard tmux
# convention). See #384 for full research on why this is unavoidable.
#
# Selections auto-copy to the system clipboard two ways (#2694):
#
# - Browser terminals: the bridge (klangk-copy-to-clipboard) POSTs the
#   text to the browser-delegate endpoint, which sets the tab's clipboard.
# - klangk shell (CLI): set-clipboard external makes tmux emit OSC 52
#   (\E]52;;<base64>) for its own copy-mode copies to the attached
#   server-side client, which carries it over the WebSocket to the user's
#   terminal (konsole, kitty, iTerm2, ...). external rather than on: with
#   on, a container app's OSC 52 read query would be forwarded to the CLI
#   user's terminal too (clipboard exfiltration path); external ignores
#   pane-app OSC 52 entirely while still emitting for copy-mode copies.
#   The attach always runs with TERM=xterm-256color (terminal.build_environment),
#   so the clipboard terminal-feature below is what teaches tmux the client
#   can do OSC 52 (stock xterm-256color terminfo has no Ms capability and
#   tmux would silently drop the escape). The feature form is used rather
#   than an Ms terminal-override because the container's tmux (3.5a)
#   mangles escape sequences (\E, \007) parsed from the config file.
#   klangk-copy-to-clipboard's own /dev/tty OSC 52 write is a no-op here (the
#   copy-command job has no controlling terminal), which is why tmux must do
#   the emission itself.
#
# In klangk shell (CLI), Shift+drag additionally gives native terminal
# selection (viewport-only).
set -g mouse on
set -g set-clipboard external
set -ga terminal-features ",xterm-256color:clipboard"

# Mouse wheel enters copy mode for scrollback.
bind -n WheelUpPane copy-mode -e \; send-keys -X -N 3 scroll-up

# Scroll three lines per wheel tick in copy mode (default is 5).
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# Copy selection to system clipboard via the bridge (browsers). copy-pipe
# sends the selected text to stdin of the script and also copies to tmux's
# paste buffer — and, with set-clipboard on above, emits OSC 52 to attached
# clients for CLI shells. -and-cancel exits copy mode after copying.
set -g copy-command "klangk-copy-to-clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Keyboard-driven copy in copy mode (Enter or y).
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel

# Shift+PgUp/PgDn also enter/navigate copy mode.
bind -n S-PgUp copy-mode -eu
bind -n S-PgDn send-keys PgDn

# Scroll within copy mode
bind -T copy-mode-vi S-PgUp send-keys -X halfpage-up
bind -T copy-mode-vi S-PgDn send-keys -X halfpage-down
bind -T copy-mode S-PgUp send-keys -X halfpage-up
bind -T copy-mode S-PgDn send-keys -X halfpage-down

# Exit copy mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel
set -g mode-keys vi

# Prevent tmux from auto-renaming windows based on the running process.
# Window names are set explicitly by the UI; auto-rename causes shared
# state to lose track of windows.
set -g allow-rename off
set -g automatic-rename off

# Status bar — subtle contextual framing: workspace name + the CLI
# disconnect hint on the left; a clickable "+ new" on the right that opens
# another klangk terminal (#2161). @workspace_name is a global user option
# set by the server on every terminal_start (idempotent, #1880). The hint
# is the CLI's ~. escape: Enter, then ~. (#2006). The "+ new" click runs a
# native tmux new-window — it works identically in `klangk shell` and the
# browser terminal, since both are tmux clients on the same session (no
# bridge/HTTP needed). Flutter tab-strip sync is separate (#2171).
set -g status on
set -g status-position bottom
set -g status-style 'bg=colour236,fg=colour246'
set -g status-left '#[fg=colour252] #{@workspace_name} #[fg=colour240]Exit: Enter, then ~. '
set -g status-left-length 60
set -g status-right '#[fg=colour252,bold] + new '
set -g status-right-length 20
# Click the "+ new" status-right segment to open a new tmux window (#2161).
bind-key -n MouseDown1StatusRight new-window -n term

# Keep sessions alive when clients detach.  Needed for session groups
# (shared terminals) so spectator/collaborator sessions survive
# disconnect.  Orphaned sessions are cleaned up explicitly.
set -g destroy-unattached off

# Respawn the shell if it exits (user types "exit", Ctrl-D, or gets
# killed).  remain-on-exit keeps the pane in "dead" state instead of
# destroying it; pane-died hook immediately respawns it.
set -g remain-on-exit on
set-hook -g pane-died 'respawn-pane'
