<!doctype html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Klangk - Web Coding Agent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klangk</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script>
      // #3219: minimal Trusted Types default policy. The served CSP
      // enforces require-trusted-types-for 'script'. The Flutter loader
      // carries its own named policy, but pdfrx assigns plain strings to
      // a script element's src and to new Worker() (a same-origin
      // pdfium_client.js asset and a same-origin blob: worker URL).
      // Sanction exactly those shapes; anything else (remote scripts,
      // data:/javascript: URLs) throws. This policy defines no
      // createHTML/createScript, so markup and eval sinks stay blocked.
      //
      // #3228: the default policy's special name was "" in early Trusted
      // Types and is "default" in the current spec — Chrome 133+ routes
      // sink fallback through the "default"-named policy and treats "" as
      // an ordinary name, so registering only "" leaves pdfrx's plain
      // string URLs blocked on modern browsers. Register both names with
      // the same rules: whichever generation the browser implements, one
      // of them is the default policy.
      (function () {
        var create = function (name) {
          try {
            if (window.trustedTypes && trustedTypes.createPolicy) {
              trustedTypes.createPolicy(name, {
                createScriptURL: function (s) {
                  var m = /^([a-z][a-z0-9+.-]*):/i.exec(s);
                  if (!m) return s; // relative: resolves inside this origin
                  if (
                    m[1] === "blob" &&
                    s.indexOf("blob:" + location.origin + "/") === 0
                  )
                    return s; // pdfrx's same-origin blob worker URL
                  if (s.indexOf(location.origin + "/") === 0) return s;
                  throw new TypeError(
                    "klangk default Trusted Types policy: refused script URL " +
                      s,
                  );
                },
              });
            }
          } catch (e) {
            // A policy with this name already exists (or TT is
            // unsupported) — leave the existing one in charge.
          }
        };
        create("default");
        create("");
      })();
    </script>
    <div
      id="loading"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #0d1117;
        color: #8b949e;
        font-family: sans-serif;
        font-size: 16px;
      "
    >
      Loading, please wait
    </div>
    <script>
      // Unregister any stale service workers
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      window.addEventListener("flutter-first-frame", function () {
        var el = document.getElementById("loading");
        if (el) el.remove();
      });
    </script>
  </body>
</html>
