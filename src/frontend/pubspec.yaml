name: klangk_frontend
description: Klangk - Web Coding Agent
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  # Direct (was transitive via sheetifye) since main.dart sets
  # GoogleFonts.config.allowRuntimeFetching = false (#3149) — the deploy is
  # first-party-only for fonts and the family the sheetifye tokens resolve
  # (RobotoMono) is bundled as an asset.
  google_fonts: ^8.2.1
  # XXX: This is because nix MacOS does not support Flutter 3.44 - yet.
  # flterm: vendored in libghostty as packages/flterm, patched to build on
  # Flutter 3.41 / Dart 3.11 (upstream 0.0.3 needs Dart 3.12 for private-named
  # parameters; the patch removes that usage), so no host Flutter is required --
  # builds with the nix toolchain. Consumed from libghostty (the standalone
  # runyaga/flterm fork is archived).
  flterm:
    git:
      url: https://github.com/runyaga/libghostty.git
      ref: "0.0.3.2"
      path: packages/flterm
  # Pinned to 0.0.9: version 0.0.10 removed Cursor.row/col and Selection
  # constructor that flterm 0.0.3.2 depends on.
  libghostty: 0.0.9
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  desktop_drop: ^0.7.1
  go_router: ^17.2.3
  flutter_markdown_plus: ^1.0.7
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  klangk_plugin_api:
    git:
      url: https://github.com/mcdonc/klangk-plugin-api.git
      ref: v0.5.1
  # Path set by import_dart_features.py — do not edit this line
  klangk_features:
    path: PLACEHOLDER
  code_forge_web: ^2.10.0
  pdfrx: ^2.4.3
  video_player: ^2.9.0
  flutter_riverpod: ^2.4.9
  sheetifye:
    git:
      url: https://github.com/runyaga/sheetifye.git
      ref: klangk-compat
  mcp_toolkit: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.2.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/libghostty-wasm32-freestanding.wasm
    # Engine fallback fonts (#3228): the CanvasKit/skwasm web renderers
    # lazily fetch Noto script fallbacks + Roboto from
    # configuration.fontFallbackBaseUrl when a frame rasterizes a codepoint
    # the bundled families lack (CJK terminal output, "…", emoji). The
    # default base is fonts.gstatic.com; web/flutter_bootstrap.js points it
    # at this same-origin mirror instead, so nothing external is ever
    # fetched and offline sessions render identically. Flutter directory
    # assets are not recursive, so every family/version directory is listed
    # explicitly; regenerate the list with
    # `python scripts/vendor_flutter_fallback_fonts.py --print-pubspec`
    # after re-vendoring (engine/toolchain bumps can change the set).
    - assets/fallback-fonts/
    - assets/fallback-fonts/notocoloremoji/v32/
