name: "E2E: Frontend Tests"

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright project (chromium|firefox|webkit); blank = all"
        required: false
        default: ""
      grep:
        description: "-g pattern to filter tests; blank = all"
        required: false
        default: ""
  push:
    branches: [release/**]
  pull_request:
    paths:
      - "src/klangk/**"
      - "src/frontend/**"
      - "src/containers/workspace/**"
      - "src/containers/network/**"
      - "features/**"
      - "devenv.nix"
      - "devenv.yaml"
      - ".github/workflows/frontend-e2e-tests.yml"
      - ".github/actions/e2e-suite/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Chromium + API tests — gates PR merges
  test-frontend-e2e:
    runs-on: nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'src/klangk/**'
              - 'src/frontend/**'
              - 'src/containers/workspace/**'
              - 'src/containers/network/**'
              - 'features/**'
              - 'devenv.nix'
              - 'devenv.yaml'
              - '.github/workflows/frontend-e2e-tests.yml'
              - '.github/actions/e2e-suite/**'

      - uses: ./.github/actions/e2e-suite
        with:
          run: ${{ steps.filter.outputs.e2e }}
          suite: >-
            test-frontend-e2e
            ${{ inputs.project && format('--project={0} --no-deps', inputs.project) || '--project=chromium-api --project=chromium --no-deps' }}
            ${{ inputs.grep && format('-g "{0}"', inputs.grep) || '' }}
          suite-name: frontend
          build-tasks: klangk:build-workspace-image klangk:build-network-sidecar klangk:flutter-build

      - name: Upload test results
        if: always() && steps.filter.outputs.e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-chromium
          retention-days: 7
          path: |
            src/frontend/e2e-tests/test-results/
            src/frontend/e2e-tests/logs/
