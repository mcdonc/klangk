name: "Backport merged PRs to stable/2.0"

on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write # push the cherry-picked branch
  pull-requests: write # create the backport PR + comment on the original

jobs:
  backport:
    name: Backport to stable/2.0
    runs-on: ubuntu-latest
    # A merged PR carrying backport/2.0 (the routine path — the label is
    # auto-applied to PRs against main while BACKPORT_2_0_DEFAULT is set,
    # see backport-autolabel.yml), or a `/backport` comment on a merged PR
    # (the rescue path for a merge that happened unlabeled; write-access
    # authors only — the repo is public and this job holds a write token).
    # stable/2.0 is the only target during the 2.0 pre-release window, so
    # the label or comment gates whether the flow runs; the target is
    # fixed here (#3361).
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged &&
        contains(github.event.pull_request.labels.*.name, 'backport/2.0')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/backport')
      )
    steps:
      # The action cherry-picks inside a git checkout and fetches the
      # source PR + target branch itself. Checkout the base branch only —
      # never PR code (pull_request_target runs with a write token).
      # korthout pushes with the credentials checkout persists, so the PAT
      # must be wired in HERE and not only into the action's github_token
      # input: GITHUB_TOKEN (the persisted default) is refused any push
      # that touches .github/workflows/ — and backports of workflow
      # changes (this file's own backports included) are exactly that
      # (#3448). The checkout ref stays the base branch, so the token never
      # runs PR code.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BACKPORT_TOKEN || github.token }}
      - name: Create backport pull request
        id: backport
        uses: korthout/backport-action@v4
        with:
          # A PR authored by github-actions[bot] via the default GITHUB_TOKEN
          # lands its CI in an approval-required state (GitHub's 2026-06-11
          # bot-PR rule), which stalls the loop on a human click.
          # BACKPORT_TOKEN is a fine-grained PAT (contents + pull-requests +
          # workflows, read/write, this repo only): PRs authored by it
          # trigger workflows with no approval gate (#3448). The ||
          # fallback keeps that gated behavior when the secret is unset.
          github_token: ${{ secrets.BACKPORT_TOKEN || github.token }}
          target_branches: stable/2.0
          # Match the hand-made backport PR titles (e.g. #3426): the
          # original PR title unchanged; the squash merge appends the
          # backport PR's own number.
          pull_title: "${pull_title}"
          # A conflicted cherry-pick opens a draft PR carrying the first
          # conflict committed, instead of only a failure comment on the
          # source PR — the backport is never silently missing (#3361
          # acceptance criteria).
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
      # Backports are sync-only (#3456): the cherry-pick is content main's
      # CI already passed, so the backport PR runs no CI of its own (every
      # pull_request-triggered workflow targets main) and this step merges
      # it in the same run that created it. --auto lands the merge at once
      # when nothing is pending and after any straggler checks pass on the
      # rare stable PR that runs some. A conflicted backport opens a draft;
      # merging a draft fails loudly and points a human at it.
      - name: Merge backport pull requests
        if: steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN || github.token }}
        run: |
          for pr in $(echo "${{ steps.backport.outputs.created_pull_numbers }}" | tr ',' ' '); do
            gh pr merge "$pr" --squash --auto --delete-branch
          done
