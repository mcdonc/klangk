name: "E2E: Cross-Browser Tests"

on:
  schedule:
    # Every 6 hours
    - cron: "0 6 * * *"
  push:
    branches: [release/**]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner kind: stock (ubuntu-latest) or the self-hosted nix VM"
        type: choice
        options: [stock, nix]
        default: stock

jobs:
  test-frontend-e2e-cross-browser:
    # Defaults to stock GitHub-hosted runners (also for the scheduled runs);
    # the self-hosted nix runner is a workflow_dispatch opt-in (input
    # runner: nix). See backend-e2e-tests.yml for the provisioning split.
    runs-on: ${{ inputs.runner == 'nix' && 'nix' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Stock runners only (see backend-e2e-tests.yml).
      - uses: ./.github/actions/devenv-setup
        if: inputs.runner != 'nix'

      - uses: ./.github/actions/e2e-suite
        with:
          run: "true"
          suite: test-frontend-e2e --project=firefox --project=webkit --no-deps
          suite-name: cross-browser
          build-tasks: klangk:build-workspace-image klangk:build-network-sidecar klangk:flutter-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-cross-browser
          retention-days: 7
          path: |
            src/frontend/e2e-tests/test-results/
            src/frontend/e2e-tests/logs/
