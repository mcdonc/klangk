name: Frontend Tests

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    paths-ignore:
      # Root-only docs/meta files can never affect what this workflow
      # tests — a PR changing only these starts no run at all (#2957).
      - "*.md"
      - "zensical.toml"
      - "bootstrap"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # some-with-excludes: see backend-tests.yml (#2957) — the default
          # 'some' quantifier ignores negated patterns.
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - 'src/frontend/lib/**'
              - 'src/frontend/test/**'
              - 'src/frontend/pubspec.yaml'
              - 'features/**/klangk/**'
              - 'scripts/lcov-report.py'
              - '.github/workflows/frontend-tests.yml'
              - '!**/*.md'

      # Pin Flutter to the nixpkgs-unstable version (devenv ships 3.47.0,
      # #2869) so CI and local runs stay in lockstep — the local coverage
      # tooling's multi-line ternary attribution and the 100% gate depend on
      # it (#2378). Bump alongside the nixpkgs Flutter when upgrading.
      - uses: subosito/flutter-action@v2
        if: steps.filter.outputs.frontend == 'true'
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Create stub klangk_features package
        if: steps.filter.outputs.frontend == 'true'
        run: bash scripts/stub_dart_features.sh

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        working-directory: src/frontend
        # Safe without GIT_LFS_SKIP_SMUDGE: stub_dart_features.sh (above)
        # replaced the real features — incl. soliplex's ag_ui git dep — with
        # a stub, so this pub get doesn't touch soliplex's dep tree. The
        # per-feature "Run feature Dart tests" step below sets the skip for its
        # own real pub gets.
        run: flutter pub get

      - name: Run tests with coverage
        if: steps.filter.outputs.frontend == 'true'
        working-directory: src/frontend
        run: flutter test --coverage

      - name: Coverage report
        if: steps.filter.outputs.frontend == 'true'
        working-directory: src/frontend
        run: python3 ../../scripts/lcov-report.py coverage/lcov.info

      - name: Run feature Dart tests
        if: steps.filter.outputs.frontend == 'true'
        run: |
          # Skip git-lfs smudge for transitive git deps — soliplex pulls ag_ui
          # from ag-ui-protocol/ag-ui.git, whose apps/dojo/e2e/fixtures/test-image.png
          # is LFS-tracked with an object unauthenticated CI can't fetch
          # (#1691-class). We only need ag_ui's Dart source, not its fixtures.
          export GIT_LFS_SKIP_SMUDGE=1
          for pubspec in features/*/klangk/pubspec.yaml; do
            dir=$(dirname "$pubspec")
            if [ -d "$dir/test" ]; then
              echo "=== Testing $dir ==="
              cd "$dir"
              flutter pub get
              flutter test
              cd "$GITHUB_WORKSPACE"
            fi
          done

      - name: Skip notice
        if: steps.filter.outputs.frontend != 'true'
        run: echo "No frontend changes — skipping tests"
