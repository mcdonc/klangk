name: Sidecar Tests

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    paths-ignore:
      # Docs/meta files can never affect what this workflow tests — a
      # PR changing only these starts no run at all (#2957). GitHub
      # filter patterns are root-anchored, so nested docs/ .md needs
      # its own entry (#3051). Never widen the .md ignore into
      # src/containers/: agent-context.md is COPYed into the workspace
      # image, so a change there is a build-path change.
      - "*.md"
      - "docs/*.md"
      - "docs/**/*.md"
      - "zensical.toml"
      - "bootstrap"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # some-with-excludes: see backend-tests.yml (#2957) — the default
          # 'some' quantifier ignores negated patterns.
          predicate-quantifier: some-with-excludes
          filters: |
            sidecar:
              - 'src/klangksidecar/**'
              - '.github/workflows/sidecar-tests.yml'
              - '!**/*.md'

      - uses: actions/setup-python@v6
        if: steps.filter.outputs.sidecar == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        if: steps.filter.outputs.sidecar == 'true'
        # The network sidecar as its own package (#2450): installs
        # klangksidecar (proxy.py + its deps: dnspython, websockets) and the
        # test extra. netfilterqueue is deliberately NOT a default install
        # (it links libnetfilter_queue, Linux + CAP_NET_ADMIN only); proxy.py
        # imports it lazily and degrades to a no-op when absent.
        run: pip install -e 'src/klangksidecar/[test]'

      - name: Run tests
        if: steps.filter.outputs.sidecar == 'true'
        # -n auto: run tests in parallel across CPUs (pytest-xdist). Branch
        # coverage gate at 100% lives in src/klangksidecar/pyproject.toml
        # (#2834); the PID-1-only entry paths carry pragmas and are exercised
        # end-to-end by test_network_sidecar_e2e.py, not by this unit suite.
        run: python -m pytest src/klangksidecar/tests -v -n auto --durations=20

      - name: Skip notice
        if: steps.filter.outputs.sidecar != 'true'
        run: echo "No sidecar package changes — skipping tests"
