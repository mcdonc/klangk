name: "E2E: CLI Tests"

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    paths:
      - "src/klangk/**"
      - "src/containers/workspace/**"
      - "src/containers/network/**"
      - "devenv.nix"
      - "devenv.yaml"
      - ".github/workflows/cli-e2e-tests.yml"
      - ".github/actions/e2e-suite/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-cli-e2e:
    runs-on: nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'src/klangk/**'
              - 'src/containers/workspace/**'
              - 'src/containers/network/**'
              - 'devenv.nix'
              - 'devenv.yaml'
              - '.github/workflows/cli-e2e-tests.yml'
              - '.github/actions/e2e-suite/**'

      - uses: ./.github/actions/e2e-suite
        with:
          run: ${{ steps.filter.outputs.e2e }}
          suite: test-cli-e2e
          suite-name: CLI
