name: Release

on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --- Container images (#3140) ------------------------------------------
  #
  # All five images publish from the tagged commit under the immutable
  # `vX.Y.Z` tag: klangk-workspace, klangk-workspace-fips,
  # klangk-network-sidecar, klangk-host, klangk-host-fips. release.yml
  # owns no build steps of its own — it calls the image workflows via
  # workflow_call with push-tag pinned to the tag, and each callee builds
  # and publishes exactly the way its continuous runs do (host pair via
  # docker, workspace + sidecar via podman). The four calls run in
  # parallel on separate runners; image-host-fips.yml builds the stock
  # host + FIPS host in one job, so the workspace + sidecar tars embedded
  # in the host image are that job's own builds, and the FIPS host layers
  # that same job's FIPS workspace — the auditable combination a release
  # tag is meant to pin.
  #
  # Versioned tags only — the release path never retags :latest; the
  # floating :latest tags stay owned by the continuous workflows.

  sidecar-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-network-sidecar.yml
    with:
      push-tag: ${{ github.ref_name }}
    secrets: inherit

  workspace-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-workspace.yml
    with:
      push-tag: ${{ github.ref_name }}
    secrets: inherit

  workspace-fips-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-workspace-fips.yml
    with:
      push-tag: ${{ github.ref_name }}
    secrets: inherit

  host-images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-host-fips.yml
    with:
      push-tag: ${{ github.ref_name }}
    secrets: inherit

  create-release:
    # After all five images are published — a release tag pins the full
    # auditable set, so the GitHub Release exists only once every image
    # made it to GHCR.
    needs: [sidecar-image, workspace-image, workspace-fips-image, host-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        run: |
          # Release body = this version's section from docs/changes.md.
          # When the section exists, use --notes only (no --generate-notes)
          # so the release body is the hand-written changelog without
          # auto-generated commit summaries (#2125).
          # Fallback: no changelog section → pure auto-generated notes.
          VERSION="$GITHUB_REF_NAME"
          # Pre-release tag (vX.Y.ZaN / bN / rcN, e.g. v2.0.0a1) → mark
          # the GitHub Release as a pre-release so it does not claim
          # "latest" from the last stable release.
          PRE_ARGS=()
          if [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+){0,2}(a|b|rc)[0-9]+$ ]]; then
            PRE_ARGS=(--prerelease)
          fi
          SECTION=""
          if [ -f docs/changes.md ]; then
            # Extract the body of the `## [<version>]` section. Matched as a
            # prefix so an optional trailing date (`## [v1.0.5] - 2026-07-07`)
            # still matches. Captured up to the next `## [` heading or EOF.
            # Backslashes are stripped from each line before matching, so the
            # escaped heading form used in docs/changes.md (`## \[v1.0.5]`,
            # which keeps the docs build from parsing the heading as a link
            # reference, #3142) and a bare `## [v1.0.5]` both match.
            SECTION="$(awk -v ver="$VERSION" '
              { line = $0; gsub(/\\/, "", line) }
              line ~ "^## \\[" ver "]" { found=1; next }
              found && line ~ /^## \[/ { exit }
              found { print }
            ' docs/changes.md)"
          fi
          if [ -n "$SECTION" ]; then
            NOTES_ARGS=(--notes "$SECTION")
          else
            # No changelog section for this version — pure auto-generated notes.
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            "${NOTES_ARGS[@]}" \
            "${PRE_ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build + publish the klangk wheel to PyPI via trusted publishing (OIDC,
  # no API token — same shape as the deleted cli-publish.yml pre-#1606).
  # Runs in parallel with the image jobs and create-release — the wheel
  # doesn't need podman/docker, and pip/uv users (the #1607 / #1645 first-run
  # audience)
  # get an installable artifact via `pip install klangk==<tag>`. The
  # distribution name is ``klangk`` (one unified wheel ships the klangkd
  # server + klangk CLI, #1606); the tag is ``vX.Y.Z``; hatch-vcs derives
  # the version from it.
  #
  # Pre-#1705 the wheel build + publish lived in this same job; #1705/#1707/
  # #1708 split it into a serial chain through a dist-smoke-test gate. The
  # smoke gate is now its own workflow (.github/workflows/dist-smoke.yml)
  # that does NOT block release — the smoke is a release-engineering tool
  # the release manager runs against a release-candidate branch before
  # tagging, not a CI gate. Releases publish without waiting on the smoke
  # so the pipeline isn't held hostage to the smoke being green (it's
  # currently red on #1709, a klangkd caddy bug, not a wheel-packaging
  # bug). Run dist-smoke.yml manually before tagging to validate a
  # release candidate.
  #
  # Trusted-publishing prereq (PyPI side, one-time): the `klangk` PyPI
  # project must have a trusted publisher configured for this repo +
  # workflow + environment (mcdonc/klangk, .github/workflows/release.yml,
  # environment name: pypi). With that in place PyPI validates the OIDC
  # token from GitHub Actions and publishes with no secret on our side.
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi # PyPI trusted publisher binds to this environment name
    permissions:
      id-token: write # OIDC attestation — the only permission trusted publishing needs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs full history to derive the version

      - uses: ./.github/actions/devenv-setup
        with:
          # Build the frontend with the default feature set (checked-in
          # features.yaml, #1660) so the wheel's klangk/frontend/ carries
          # the compiled UI + features.json. The hatch build hook
          # (hatch_build_frontend.py) force-includes it and *requires* it
          # for non-editable wheel builds (#1600).
          build-tasks: klangk:flutter-build

      - name: Build wheel
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          # scripts/build_wheel.sh builds via `uv build` in its own isolated
          # env — the shared devenv venv is never touched (#3143). Requires
          # the frontend artifact from klangk:flutter-build above — the hatch
          # build hook force-includes it and requires it for non-editable
          # wheel builds (#1600).
          devenv shell -- bash scripts/build_wheel.sh

      - name: Publish to PyPI
        # Trusted publishing (OIDC) — no API token. pypa/gh-action-pypi-publish
        # negotiates an OIDC token from GitHub Actions and presents it to
        # PyPI, which validates it against the trusted-publisher config on
        # the `klangk` project (environment: pypi, workflow: release.yml).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/klangk/dist
          skip-existing: true # idempotent on re-runs of the same tag
