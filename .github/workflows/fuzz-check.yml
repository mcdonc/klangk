name: "Fuzz API: endpoint drift check"

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    paths-ignore:
      # Docs/meta files can never affect what this workflow tests — a
      # PR changing only these starts no run at all (#2957). GitHub
      # filter patterns are root-anchored, so nested docs/ .md needs
      # its own entry (#3051). Never widen the .md ignore into
      # src/containers/: agent-context.md is COPYed into the workspace
      # image, so a change there is a build-path change.
      - "*.md"
      - "docs/*.md"
      - "docs/**/*.md"
      - "zensical.toml"
      - "bootstrap"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fuzz-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'scripts/fuzz-api.py'
              - 'src/klangk/klangk/api/**'
              - 'src/klangk/klangk/main.py'
              - '.github/workflows/fuzz-check.yml'

      - uses: ./.github/actions/devenv-setup
        if: steps.filter.outputs.relevant == 'true'

      - name: Check fuzzer ENDPOINTS against the live router
        if: steps.filter.outputs.relevant == 'true'
        run: devenv shell -- python scripts/fuzz-api.py --check

      - name: Skip notice
        if: steps.filter.outputs.relevant != 'true'
        run: echo "No fuzzer/API changes — skipping fuzz drift check"
