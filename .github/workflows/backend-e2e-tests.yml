name: "E2E: Backend Tests"

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-backend-e2e:
    # Self-hosted NixOS runner (label "nix", klangk-ci VM). nix, devenv, git,
    # and rootless podman (SUID newuidmap shims) come from the host config;
    # the shared action handles devenv prep, image builds, cleanup, and the
    # suite itself.
    runs-on: nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'src/klangk/**'
              - 'src/containers/workspace/**'
              - 'src/containers/network/**'
              - 'devenv.nix'
              - 'devenv.yaml'
              - '.github/workflows/backend-e2e-tests.yml'
              - '.github/actions/e2e-suite/**'

      - uses: ./.github/actions/e2e-suite
        with:
          run: ${{ steps.filter.outputs.e2e }}
          suite: test-backend-e2e
          suite-name: backend
          verbose-podman: "true"
          # The FIPS variant feeds test_fips_e2e.py's positive-path class
          # (~2 min of OpenSSL compile on the ephemeral VM; the stamp
          # logic in the build script can't help across VMs).
          build-tasks: >-
            klangk:build-workspace-image
            klangk:build-network-sidecar
            klangk:build-fips-image
