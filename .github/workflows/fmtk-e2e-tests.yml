name: "E2E: fmtk Frontend Tests"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner kind: stock (ubuntu-latest) or the self-hosted nix VM"
        type: choice
        options: [stock, nix]
        default: stock
  push:
    branches: [release/**]
  # The suite runs on manual dispatch and release-branch pushes only —
  # no pull_request trigger: until the #3264 flake is fixed, a PR-triggered
  # run can red any backend PR through the src/klangk/** paths filter
  # (#3266). Validate a PR branch by dispatching this workflow on it;
  # re-add the trigger together with the #3264 fix.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # fmtk-driven browser e2e (#3232/#3231): boots the fmtk-up scratch stack
  # (headless Chrome under CI — no DISPLAY) and drives the debug frontend
  # through the fmtk CLI. The frontend compiles from source via
  # `flutter run --debug`; the suites start real workspace containers, so
  # CI builds the workspace image and the network sidecar (interactive
  # egress fail-closes without the sidecar) before running them.
  test-fmtk-e2e:
    runs-on: ${{ inputs.runner == 'nix' && 'nix' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # No cross-run reuse on CI: the self-hosted nix VM persists processes
      # AND state between dispatches, and an adopted backend would be built
      # from the PREVIOUS commit's code (silent false greens/reds). Stock
      # runners are ephemeral anyway — fresh costs nothing there.
      FMTK_E2E_FRESH: "1"
    steps:
      - uses: actions/checkout@v7

      # Stock runners only (see backend-e2e-tests.yml).
      - uses: ./.github/actions/devenv-setup
        if: inputs.runner != 'nix'

      - uses: ./.github/actions/e2e-suite
        with:
          run: "true"
          suite: test-fmtk-e2e
          suite-name: fmtk

      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fmtk-e2e-logs
          retention-days: 7
          path: |
            .devenv/state/fmtk/klangkd.log
            .devenv/state/fmtk/caddy.log
            .devenv/state/fmtk/flutter-e2e.log
