name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    paths-ignore:
      # Docs/meta files can never affect what this workflow tests — a
      # PR changing only these starts no run at all (#2957). "*.md" is
      # root-anchored (GitHub globs match full paths; * does not cross
      # "/"), and docs/**/*.md covers the whole docs tree including
      # its top level — docs/*.md is belt-and-braces (#3051). Never
      # widen the .md ignore into src/containers/: agent-context.md is
      # COPYed into the workspace image — a build-path change.
      - "*.md"
      - "docs/*.md"
      - "docs/**/*.md"
      - "zensical.toml"
      - "bootstrap"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # some-with-excludes: a changed file counts toward the filter only
          # if it matches an inclusion and no exclusion — without this the
          # default 'some' quantifier ignores negated patterns entirely.
          predicate-quantifier: some-with-excludes
          filters: |
            python:
              - 'src/klangk/**'
              - 'scripts/**'
              - 'features/**'
              - 'features.yaml'
              - '.github/workflows/backend-tests.yml'
              # Docs-only .md changes (READMEs, feature docs) can't affect
              # the suite — a PR whose diff is otherwise docs-only skips it (#2957).
              - '!**/*.md'

      - uses: actions/setup-python@v6
        if: steps.filter.outputs.python == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        if: steps.filter.outputs.python == 'true'
        # One unified distribution (src/klangk) ships the klangk package
        # (server + CLI). The two unit suites share one --cov gate (#1606).
        run: pip install -e 'src/klangk/[test]'

      - name: Run tests
        if: steps.filter.outputs.python == 'true'
        # -n auto: run tests in parallel across CPUs (pytest-xdist)
        run: python -m pytest src/klangk/klangkd-tests/tests src/klangk/klangkc-tests/tests -v -n auto --durations=20

      - name: Run build-pipeline tests
        if: steps.filter.outputs.python == 'true'
        # Exercises update_features.py + import_dart_features.py against the
        # real checked-in features.yaml + features/ — catches build-side
        # regressions the runtime test suite can't see (#1666). No coverage
        # gate here (scripts/ isn't part of the klangk package).
        run: python -m pytest scripts/tests/ -v

      - name: Skip notice
        if: steps.filter.outputs.python != 'true'
        run: echo "No Python package changes — skipping tests"
