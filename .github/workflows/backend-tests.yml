name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    branches: [main] # PR CI targets main; backport PRs to stable/2.0 run none (#3456)
    paths-ignore:
      # Docs/meta files can never affect what this workflow tests — a
      # PR changing only these starts no run at all (#2957). "*.md" is
      # root-anchored (GitHub globs match full paths; * does not cross
      # "/"), and docs/**/*.md covers the whole docs tree including
      # its top level — docs/*.md is belt-and-braces (#3051). Never
      # widen the .md ignore into src/containers/: agent-context.md is
      # COPYed into the workspace image — a build-path change.
      - "*.md"
      - "docs/*.md"
      - "docs/**/*.md"
      - "zensical.toml"
      - "bootstrap"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # some-with-excludes: a changed file counts toward the filter only
          # if it matches an inclusion and no exclusion — without this the
          # default 'some' quantifier ignores negated patterns entirely.
          predicate-quantifier: some-with-excludes
          filters: |
            python:
              - 'src/klangk/**'
              - 'scripts/**'
              - 'features/**'
              - 'features.yaml'
              - '.github/workflows/backend-tests.yml'
              # Docs-only .md changes (READMEs, feature docs) can't affect
              # the suite — a PR whose diff is otherwise docs-only skips it (#2957).
              - '!**/*.md'

      - uses: astral-sh/setup-uv@v10
        if: steps.filter.outputs.python == 'true'
        with:
          # Pinned uv: lock semantics can change between uv versions, so CI
          # should not float on the latest release either.
          version: "0.11.28"
          # Provision the interpreter from the lock's requires-python (>=3.14)
          # and cache wheels keyed on uv.lock — replaces setup-python's
          # pip cache.
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies from the lockfile
        if: steps.filter.outputs.python == 'true'
        # Locked install from the root uv.lock — the same one devenv syncs
        # (`klangk:uv-sync`). An unlocked `pip install -e 'src/klangk/[test]'`
        # resolved whatever was newest on PyPI, and an upstream litellm
        # release flipped every backend run red overnight (#3574); the
        # lock pins litellm 1.95.0. Dependency updates now land through
        # dependabot's uv.lock PRs, whose own CI run validates the new
        # versions before merge. The workspace root is virtual (no
        # [project]); --extra test applies klangk[test] to the members,
        # mirroring the devenv task. .venv/bin goes on PATH so the
        # pytest steps below run the locked interpreter unchanged.
        run: |
          uv sync --locked --extra test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        if: steps.filter.outputs.python == 'true'
        # -n auto: run tests in parallel across CPUs (pytest-xdist)
        run: python -m pytest src/klangk/klangkd-tests/tests src/klangk/klangkc-tests/tests -v -n auto --durations=20

      - name: Run build-pipeline tests
        if: steps.filter.outputs.python == 'true'
        # Exercises update_features.py + import_dart_features.py against the
        # real checked-in features.yaml + features/ — catches build-side
        # regressions the runtime test suite can't see (#1666). No coverage
        # gate here (scripts/ isn't part of the klangk package).
        run: python -m pytest scripts/tests/ -v

      - name: Skip notice
        if: steps.filter.outputs.python != 'true'
        run: echo "No Python package changes — skipping tests"
