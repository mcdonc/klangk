name: E2E suite (stock or self-hosted nix runner)
description: Shared prepare/build/cleanup/run steps for the e2e suites. Works
  on GitHub-hosted runners (after ./.github/actions/devenv-setup has installed
  nix + devenv + podman) and on the self-hosted NixOS runner (label "nix",
  klangk-ci VM) where the toolchain comes from the host config.

inputs:
  run:
    description: "'true' to run the suite (wire steps.filter.outputs.e2e here); anything else skips it"
    required: true
  suite:
    description: "devenv shell command to execute (e.g. test-backend-e2e, 'test-frontend-e2e --project=chromium')"
    required: true
  suite-name:
    description: "Human-readable suite name for step names and the skip notice"
    required: true
  build-tasks:
    description: "Space-separated devenv tasks for the build step"
    default: "klangk:build-workspace-image klangk:build-network-sidecar"
  fips-image:
    description: >-
      Pull this published FIPS image (retagged klangk-workspace-fips:latest)
      instead of compiling it per-run (#2631). On pull failure, falls back
      to a local build with the compile parallelism capped
      (KLANGKBUILD_FIPS_BUILD_JOBS=2) so a shared host is not starved.
      Empty = no FIPS image handling.
    default: ""
  verbose-podman:
    description: "Set KLANGK_E2E_VERBOSE_PODMAN=1 (pytest plugin surfacing podman stderr of failed calls)"
    default: "false"

runs:
  using: composite
  steps:
    # On GitHub-hosted runners devenv/nix only land on PATH after sourcing
    # the nix profile (installed by devenv-setup); on the self-hosted nix
    # runner the profile file also exists and sourcing it is a no-op.
    - name: Prepare klangk devenv
      # Gated on the filter like the build/run steps: on stock runners
      # devenv-setup is skipped when there is nothing to run, and devenv
      # would not be on PATH here.
      if: inputs.run == 'true'
      shell: bash
      run: |
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null || true
        devenv shell -- true

    - name: Build images
      if: inputs.run == 'true'
      shell: bash
      run: |
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null || true
        devenv tasks run ${{ inputs.build-tasks }}

    - name: Obtain FIPS image (pull, capped-build fallback)
      # #2631: the FIPS workspace image is published by image-workspace-
      # fips.yml on GitHub-hosted runners; pulling it here replaces a
      # per-run `make -j$(nproc)` OpenSSL compile on the shared self-hosted
      # host, which starved sibling e2e suites' podman execs. If the pull
      # fails (package not yet published/flipped public, network), fall
      # back to building locally with the compile capped to 2 jobs —
      # slower, but bounded blast radius.
      if: inputs.run == 'true' && inputs.fips-image != ''
      shell: bash
      run: |
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null || true
        if devenv shell -- bash scripts/pull-fips-image.sh "${{ inputs.fips-image }}"; then
          echo "FIPS image pulled from ${{ inputs.fips-image }}"
        else
          echo "Pull failed — building FIPS image locally (compile capped to 2 jobs, #2631)"
          KLANGKBUILD_FIPS_BUILD_JOBS=2 devenv shell -- devenv tasks run klangk:build-fips-image
        fi

    - name: Clean leftover CI podman state
      if: inputs.run == 'true'
      shell: bash
      # Ephemeral JIT VMs shouldn't have leftover state, but guard
      # against incomplete prior boots or pool restarts.
      run: |
        podman rm -f klangk-prewarm >/dev/null 2>&1 || true
        podman ps -aq --filter label=klangk.managed=true \
          | xargs -r podman rm -f >/dev/null 2>&1 || true
        podman network ls --format '{{.Name}}' \
          | grep -E '^(netc-e2e|consent-e2e|egress-e2e|netc-pp)' \
          | xargs -r -n1 podman network rm -f >/dev/null 2>&1 || true

    - name: Run ${{ inputs.suite-name }} E2E tests
      if: inputs.run == 'true'
      shell: bash
      env:
        KLANGK_E2E_VERBOSE_PODMAN: ${{ inputs.verbose-podman == 'true' && '1' || '' }}
      run: |
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null || true
        devenv shell -- ${{ inputs.suite }}

    - name: Skip notice
      if: inputs.run != 'true'
      shell: bash
      run: echo "No e2e-relevant changes — skipping ${{ inputs.suite-name }} E2E tests"
